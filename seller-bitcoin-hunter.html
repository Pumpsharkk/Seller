<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SELLER: Bitcoin Avcısı</title>
<style>
  :root{
    --brick: #7a3324;
    --brick-dark: #5a2419;
    --mortar: #c9a87c;
    --sky-top: #2b3a52;
    --sky-bot: #6b8cae;
    --neon: #ffd93d;
    --hud-bg: rgba(20,14,10,0.72);
    --btc-orange: #f7931a;
    --danger: #ff4d4d;
    --hoodie: #2c3a8f;
    --hoodie-dark: #1e2a68;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:#000; font-family: 'Segoe UI', Arial, sans-serif; touch-action:none;
  }
  #gameContainer{
    position:relative; width:100vw; height:100vh; overflow:hidden;
    background: linear-gradient(to bottom, var(--sky-top), var(--sky-bot) 70%);
  }
  canvas{ position:absolute; top:0; left:0; display:block; }

  /* HUD */
  #hud{
    position:absolute; top:0; left:0; width:100%; padding:14px 16px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; z-index:10;
  }
  .hudBox{
    background: var(--hud-bg); border:2px solid var(--btc-orange); border-radius:10px;
    padding:8px 14px; color:#fff; font-weight:700; letter-spacing:0.5px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  #scoreBox{font-size:20px;}
  #scoreBox span{color:var(--btc-orange);}
  #waveBox{font-size:14px; text-align:right;}
  #livesBox{margin-top:6px; font-size:16px;}
  .heart{color:var(--danger); margin-left:2px;}

  /* Start / Game Over overlays */
  .overlay{
    position:absolute; top:0; left:0; width:100%; height:100%;
    background: rgba(10,8,15,0.88); display:flex; flex-direction:column;
    align-items:center; justify-content:center; z-index:50; text-align:center; padding:20px;
  }
  .overlay h1{
    color:var(--btc-orange); font-size:clamp(28px,7vw,48px); margin:0 0 6px 0;
    text-shadow: 0 0 20px rgba(247,147,26,0.6); letter-spacing:2px;
  }
  .overlay h2{ color:#fff; font-size:clamp(16px,4vw,22px); margin:0 0 20px 0; font-weight:400; opacity:0.85;}
  .overlay p.tag{color:#ffd93d; font-size:14px; margin-bottom:24px; max-width:420px;}
  .bigBtn{
    background: linear-gradient(180deg, var(--btc-orange), #c9720e);
    color:#1a1000; border:none; padding:16px 44px; font-size:20px; font-weight:800;
    border-radius:50px; cursor:pointer; box-shadow: 0 6px 0 #8a4c08, 0 8px 16px rgba(0,0,0,0.4);
    letter-spacing:1px; transition: transform 0.08s;
  }
  .bigBtn:active{ transform: translateY(4px); box-shadow: 0 2px 0 #8a4c08; }
  #finalScoreWrap{margin-bottom:20px;}
  #finalScore{font-size:40px; color:#fff; font-weight:900;}

  /* Controls */
  #controls{
    position:absolute; bottom:0; left:0; width:100%; height:220px;
    display:flex; justify-content:space-between; align-items:flex-end;
    padding:0 24px 24px 24px; z-index:20; pointer-events:none;
  }
  #joyZone{
    width:130px; height:130px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
    border:3px solid rgba(255,217,61,0.5);
    position:relative; pointer-events:auto;
  }
  #joyStick{
    width:56px; height:56px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffe58a, var(--btc-orange));
    position:absolute; top:37px; left:37px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    pointer-events:none;
  }
  #fireBtn{
    width:100px; height:100px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ff8a8a, var(--danger));
    border:3px solid rgba(255,255,255,0.5);
    box-shadow: 0 6px 0 #a02525, 0 8px 14px rgba(0,0,0,0.5);
    display:flex; align-items:center; justify-content:center;
    color:#3a0000; font-weight:900; font-size:16px; letter-spacing:1px;
    pointer-events:auto; cursor:pointer;
  }
  #fireBtn:active{ transform: translateY(4px); box-shadow: 0 2px 0 #a02525; }
  #hint{
    position:absolute; bottom:230px; left:0; width:100%; text-align:center;
    color:rgba(255,255,255,0.6); font-size:12px; z-index:15; pointer-events:none;
  }
  .hidden{display:none !important;}
  #muteBtn{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    background: var(--hud-bg); border:2px solid var(--btc-orange); border-radius:8px;
    color:#fff; padding:6px 10px; font-size:16px; z-index:10; cursor:pointer; pointer-events:auto;
  }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div>
      <div id="scoreBox" class="hudBox">PUAN: <span id="scoreVal">0</span></div>
      <div id="livesBox" class="hudBox">CAN: <span id="livesVal">❤❤❤</span></div>
    </div>
    <div id="waveBox" class="hudBox">DALGA <span id="waveVal">1</span></div>
  </div>

  <button id="muteBtn">🔊</button>

  <div id="hint">Sol joystick: nişan al &nbsp;|&nbsp; Sağ düğme: ATEŞ</div>

  <div id="controls">
    <div id="joyZone"><div id="joyStick"></div></div>
    <div id="fireBtn">ATEŞ</div>
  </div>

  <div id="startOverlay" class="overlay">
    <h1>SELLER</h1>
    <h2>BITCOIN AVCISI</h2>
    <p class="tag">Seller, elindeki silahla önünden geçen Bitcoin canavarlarını avlıyor. Joystick ile nişan al, ATEŞ düğmesi ile vur. Kaçırdığın her canavar bir can götürür!</p>
    <button class="bigBtn" id="startBtn">OYUNA BAŞLA</button>
  </div>

  <div id="gameOverOverlay" class="overlay hidden">
    <h1 style="color:var(--danger);">OYUN BİTTİ</h1>
    <div id="finalScoreWrap">
      <div style="color:#fff;font-size:14px;margin-bottom:6px;">TOPLAM PUAN</div>
      <div id="finalScore">0</div>
    </div>
    <button class="bigBtn" id="restartBtn">TEKRAR OYNA</button>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('gameContainer');

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = container.clientWidth;
    H = container.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- AUDIO (synthesized, no external files) ----------
  let audioCtx = null;
  let muted = false;
  function ensureAudio(){
    if(!audioCtx){
      try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    }
  }
  function playGunshot(){
    if(muted || !audioCtx) return;
    const t = audioCtx.currentTime;
    // noise burst
    const bufferSize = audioCtx.sampleRate * 0.15;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 2);
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = 'lowpass';
    noiseFilter.frequency.setValueAtTime(3500, t);
    noiseFilter.frequency.exponentialRampToValueAtTime(400, t+0.12);
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.9, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, t+0.15);
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(audioCtx.destination);
    noise.start(t); noise.stop(t+0.16);

    // low thump
    const osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.exponentialRampToValueAtTime(40, t+0.1);
    const oscGain = audioCtx.createGain();
    oscGain.gain.setValueAtTime(0.5, t);
    oscGain.gain.exponentialRampToValueAtTime(0.01, t+0.12);
    osc.connect(oscGain); oscGain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t+0.12);
  }
  function playHit(){
    if(muted || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, t);
    osc.frequency.exponentialRampToValueAtTime(220, t+0.15);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.01, t+0.18);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t+0.2);
  }
  function playCoin(){
    if(muted || !audioCtx) return;
    const t = audioCtx.currentTime;
    [660,880,1320].forEach((f,i)=>{
      const osc = audioCtx.createOscillator();
      osc.type='sine';
      osc.frequency.setValueAtTime(f, t+i*0.05);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.25, t+i*0.05);
      g.gain.exponentialRampToValueAtTime(0.01, t+i*0.05+0.2);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(t+i*0.05); osc.stop(t+i*0.05+0.22);
    });
  }
  function playEmpty(){
    if(muted || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    osc.type='square'; osc.frequency.setValueAtTime(200,t);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.06);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t+0.07);
  }
  function playLoseLife(){
    if(muted || !audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    osc.type='sawtooth'; osc.frequency.setValueAtTime(300,t);
    osc.frequency.exponentialRampToValueAtTime(80, t+0.4);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.42);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t+0.45);
  }

  // ---------- GAME STATE ----------
  let score = 0;
  let lives = 3;
  let wave = 1;
  let running = false;
  let ammo = 6;
  let maxAmmo = 6;
  let reloading = false;
  let reloadTimer = 0;

  const player = {
    x: 0, y: 0, // set on resize (fixed at bottom center)
    aimAngle: -Math.PI/2, // pointing up by default
    aimDist: 0,
    muzzleFlash: 0,
    recoil: 0
  };

  function placePlayer(){
    player.x = W/2;
    player.y = H - 150;
  }

  let bullets = [];
  let monsters = [];
  let particles = [];
  let floatingTexts = [];

  let spawnTimer = 0;
  let spawnInterval = 1400; // ms
  let waveTimer = 0;
  const WAVE_DURATION = 20000;

  function resetGame(){
    score = 0; lives = 3; wave = 1; ammo = maxAmmo; reloading = false; reloadTimer=0;
    bullets = []; monsters = []; particles = []; floatingTexts = [];
    spawnTimer = 0; spawnInterval = 1400; waveTimer = 0;
    placePlayer();
    updateHUD();
  }

  function updateHUD(){
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('waveVal').textContent = wave;
    document.getElementById('livesVal').textContent = '❤'.repeat(Math.max(lives,0)) + '🖤'.repeat(Math.max(3-lives,0));
  }

  // ---------- MONSTERS (Bitcoin creatures) ----------
  function spawnMonster(){
    const side = Math.random() < 0.5 ? -1 : 1;
    const fromLeft = Math.random() < 0.5;
    const y = H*0.15 + Math.random()*(H*0.45);
    const speedBase = 60 + wave*10;
    const m = {
      x: fromLeft ? -60 : W+60,
      y: y,
      vx: (fromLeft ? 1 : -1) * (speedBase/1000) * (0.7+Math.random()*0.6),
      vy: (Math.random()-0.5) * 0.02,
      r: 26 + Math.random()*10,
      hp: 1 + Math.floor(wave/3),
      maxHp: 1 + Math.floor(wave/3),
      wobble: Math.random()*Math.PI*2,
      alive: true,
      hitFlash: 0,
      points: 10 + wave*2
    };
    monsters.push(m);
  }

  // ---------- BULLETS ----------
  function shoot(){
    if(reloading) return;
    if(ammo <= 0){ playEmpty(); startReload(); return; }
    ammo--;
    player.recoil = 8;
    player.muzzleFlash = 6;
    const angle = player.aimAngle;
    const speed = 0.9;
    const gx = player.x + Math.cos(angle)*40;
    const gy = player.y - 60 + Math.sin(angle)*40;
    bullets.push({
      x: gx, y: gy,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      life: 1200
    });
    playGunshot();
    if(ammo<=0) startReload();
  }
  function startReload(){
    reloading = true;
    reloadTimer = 900;
  }

  // ---------- PARTICLES ----------
  function spawnExplosion(x,y,color){
    for(let i=0;i<14;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 0.08+Math.random()*0.25;
      particles.push({
        x,y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 500+Math.random()*300, maxLife:800, color
      });
    }
  }
  function spawnFloatingText(x,y,text,color){
    floatingTexts.push({x,y,text,color,life:800,maxLife:800});
  }

  // ---------- INPUT: JOYSTICK ----------
  const joyZone = document.getElementById('joyZone');
  const joyStick = document.getElementById('joyStick');
  let joyActive = false;
  let joyCenter = {x:0,y:0};
  let joyVec = {x:0,y:0};
  const JOY_RADIUS = 55;

  function joyStart(clientX, clientY){
    joyActive = true;
    const rect = joyZone.getBoundingClientRect();
    joyCenter.x = rect.left + rect.width/2;
    joyCenter.y = rect.top + rect.height/2;
    ensureAudio();
    joyMove(clientX, clientY);
  }
  function joyMove(clientX, clientY){
    if(!joyActive) return;
    let dx = clientX - joyCenter.x;
    let dy = clientY - joyCenter.y;
    const dist = Math.min(Math.hypot(dx,dy), JOY_RADIUS);
    const angle = Math.atan2(dy,dx);
    const sx = Math.cos(angle)*dist;
    const sy = Math.sin(angle)*dist;
    joyStick.style.transform = `translate(${sx}px, ${sy}px)`;
    joyVec.x = sx/JOY_RADIUS;
    joyVec.y = sy/JOY_RADIUS;
    if(dist > 6){
      // aim angle: up-based joystick controls aim direction across upper hemisphere
      player.aimAngle = angle;
    }
  }
  function joyEnd(){
    joyActive = false;
    joyStick.style.transform = `translate(0px,0px)`;
    joyVec.x = 0; joyVec.y = 0;
  }

  joyZone.addEventListener('touchstart', e=>{ e.preventDefault(); const t=e.changedTouches[0]; joyStart(t.clientX,t.clientY); }, {passive:false});
  joyZone.addEventListener('touchmove', e=>{ e.preventDefault(); const t=e.changedTouches[0]; joyMove(t.clientX,t.clientY); }, {passive:false});
  joyZone.addEventListener('touchend', e=>{ e.preventDefault(); joyEnd(); }, {passive:false});
  joyZone.addEventListener('mousedown', e=>{ joyStart(e.clientX,e.clientY);
    const mm = ev=>joyMove(ev.clientX,ev.clientY);
    const mu = ()=>{ joyEnd(); window.removeEventListener('mousemove',mm); window.removeEventListener('mouseup',mu); };
    window.addEventListener('mousemove',mm); window.addEventListener('mouseup',mu);
  });

  // ---------- INPUT: FIRE BUTTON ----------
  const fireBtn = document.getElementById('fireBtn');
  let fireHeld = false;
  let fireHoldTimer = 0;
  function fireDown(e){
    if(e) e.preventDefault();
    ensureAudio();
    fireHeld = true;
    shoot();
  }
  function fireUp(e){
    if(e) e.preventDefault();
    fireHeld = false;
  }
  fireBtn.addEventListener('touchstart', fireDown, {passive:false});
  fireBtn.addEventListener('touchend', fireUp, {passive:false});
  fireBtn.addEventListener('mousedown', fireDown);
  fireBtn.addEventListener('mouseup', fireUp);
  fireBtn.addEventListener('mouseleave', fireUp);

  // ---------- KEYBOARD (desktop fallback) ----------
  const keys = {};
  window.addEventListener('keydown', e=>{
    ensureAudio();
    keys[e.key] = true;
    if(e.key === ' '){ e.preventDefault(); shoot(); }
  });
  window.addEventListener('keyup', e=>{ keys[e.key]=false; });

  // mouse aim on desktop
  canvas.addEventListener('mousemove', e=>{
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    player.aimAngle = Math.atan2(my - (player.y-60), mx - player.x);
  });
  canvas.addEventListener('click', ()=>{ ensureAudio(); shoot(); });

  // ---------- MUTE ----------
  const muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', ()=>{
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  // ---------- START / RESTART ----------
  document.getElementById('startBtn').addEventListener('click', ()=>{
    ensureAudio();
    document.getElementById('startOverlay').classList.add('hidden');
    resetGame();
    running = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  });
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    ensureAudio();
    document.getElementById('gameOverOverlay').classList.add('hidden');
    resetGame();
    running = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  });

  function gameOver(){
    running = false;
    document.getElementById('finalScore').textContent = score;
    document.getElementById('gameOverOverlay').classList.remove('hidden');
  }

  // ---------- BACKGROUND (buildings) ----------
  const buildings = [];
  function makeBuildings(){
    buildings.length = 0;
    let x = -20;
    while(x < W+40){
      const bw = 60 + Math.random()*70;
      const bh = 120 + Math.random()*220;
      buildings.push({x, w:bw, h:bh, color: Math.random()<0.5 ? '#2a3550' : '#232b45'});
      x += bw + 4;
    }
  }

  // ---------- DRAW PLAYER (Seller character) ----------
  function drawPlayer(){
    const px = player.x, py = player.y;
    ctx.save();
    ctx.translate(px, py);

    // recoil decay
    if(player.recoil>0) player.recoil -= 0.6;
    if(player.muzzleFlash>0) player.muzzleFlash -= 0.5;

    // shadow
    ctx.beginPath();
    ctx.ellipse(0, 78, 46, 12, 0, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();

    // body / hoodie
    ctx.beginPath();
    ctx.moveTo(-38, 80);
    ctx.quadraticCurveTo(-46, 10, -30, -30);
    ctx.quadraticCurveTo(-16, -46, 0, -46);
    ctx.quadraticCurveTo(16, -46, 30, -30);
    ctx.quadraticCurveTo(46, 10, 38, 80);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0,-46,0,80);
    grad.addColorStop(0, '#38489f');
    grad.addColorStop(1, getCSS('--hoodie-dark'));
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#141a45';
    ctx.lineWidth = 3;
    ctx.stroke();

    // hoodie strings
    ctx.strokeStyle = '#0f1440';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-8,-4); ctx.lineTo(-10,26); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8,-4); ctx.lineTo(10,26); ctx.stroke();
    ctx.fillStyle = '#0f1440';
    ctx.beginPath(); ctx.arc(-10,28,3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(10,28,3,0,Math.PI*2); ctx.fill();

    // hood ring around face
    ctx.beginPath();
    ctx.ellipse(0,-38,34,32,0,0,Math.PI*2);
    ctx.fillStyle = '#141a45';
    ctx.fill();

    // face
    ctx.beginPath();
    ctx.ellipse(0,-36,25,26,0,0,Math.PI*2);
    ctx.fillStyle = '#e0a877';
    ctx.fill();

    // stubble
    ctx.fillStyle = 'rgba(90,60,40,0.35)';
    for(let i=0;i<26;i++){
      const ang = Math.random()*Math.PI - Math.PI*0.1;
      const rx = 10+Math.random()*13;
      const ry = 8+Math.random()*8;
      ctx.beginPath();
      ctx.arc(Math.cos(ang)*rx*0.9, -20+Math.sin(ang)*ry*0.6+8, 0.8, 0, Math.PI*2);
      ctx.fill();
    }

    // hair
    ctx.fillStyle = '#b98a4e';
    ctx.beginPath();
    ctx.moveTo(-22,-52);
    ctx.lineTo(-14,-64); ctx.lineTo(-8,-54);
    ctx.lineTo(0,-66); ctx.lineTo(8,-54);
    ctx.lineTo(16,-64); ctx.lineTo(22,-50);
    ctx.quadraticCurveTo(0,-62,-22,-52);
    ctx.closePath();
    ctx.fill();

    // glowing eyes
    const eyeGlow = 4 + Math.sin(Date.now()/180)*1.5;
    ctx.save();
    ctx.shadowColor = '#fff9d6';
    ctx.shadowBlur = 14+eyeGlow;
    ctx.fillStyle = '#fffdf2';
    ctx.beginPath(); ctx.ellipse(-9,-34,5.5,4,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9,-34,5.5,4,0,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // mouth (flat, tired)
    ctx.strokeStyle = '#6b4226';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-7,-20); ctx.lineTo(7,-20); ctx.stroke();

    ctx.restore();

    // ---- ARMS + GUN (drawn separately for aiming) ----
    drawArmsAndGun(px, py);
  }

  function drawArmsAndGun(px,py){
    const shoulderY = py - 20;
    const angle = player.aimAngle;
    const handX = px + Math.cos(angle) * (60 - player.recoil);
    const handY = (py-60) + Math.sin(angle) * (60 - player.recoil);

    // back arm (fixed, holding gun support)
    ctx.strokeStyle = getCSS('--hoodie-dark');
    ctx.lineWidth = 15;
    ctx.lineCap = 'round';

    // front arm - from shoulder to hand
    ctx.beginPath();
    ctx.moveTo(px+14, shoulderY);
    ctx.quadraticCurveTo(px + Math.cos(angle)*30, (py-60)+Math.sin(angle)*30 - 6, handX, handY);
    ctx.strokeStyle = '#38489f';
    ctx.lineWidth = 14;
    ctx.stroke();
    ctx.strokeStyle = '#141a45';
    ctx.lineWidth = 14;
    ctx.globalAlpha = 0.0;
    ctx.stroke();
    ctx.globalAlpha = 1;

    // GUN
    ctx.save();
    ctx.translate(handX, handY);
    ctx.rotate(angle);
    // body
    ctx.fillStyle = '#2b2b2b';
    ctx.fillRect(-6, -6, 34, 12);
    // grip
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-10, 2, 10, 16);
    // barrel tip
    ctx.fillStyle = '#111';
    ctx.fillRect(26, -4, 8, 8);
    ctx.restore();

    // muzzle flash
    if(player.muzzleFlash > 0){
      const fx = handX + Math.cos(angle)*38;
      const fy = handY + Math.sin(angle)*38;
      ctx.save();
      ctx.translate(fx,fy);
      ctx.rotate(angle);
      ctx.fillStyle = 'rgba(255,220,80,' + (player.muzzleFlash/6) + ')';
      ctx.beginPath();
      ctx.moveTo(0,0); ctx.lineTo(16,-8); ctx.lineTo(22,0); ctx.lineTo(16,8);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function getCSS(varName){
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  // ---------- DRAW MONSTER (bitcoin creature) ----------
  function drawMonster(m){
    ctx.save();
    ctx.translate(m.x, m.y + Math.sin(m.wobble)*4);
    const flash = m.hitFlash > 0;
    // body
    ctx.beginPath();
    ctx.arc(0,0,m.r,0,Math.PI*2);
    const g = ctx.createRadialGradient(-m.r*0.3,-m.r*0.3,2,0,0,m.r);
    if(flash){
      g.addColorStop(0,'#fff'); g.addColorStop(1,'#ffdca0');
    } else {
      g.addColorStop(0,'#ffd25c'); g.addColorStop(1,'#f7931a');
    }
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#a85f0a';
    ctx.lineWidth = 3;
    ctx.stroke();

    // spikes
    ctx.fillStyle = flash ? '#fff' : '#c9720e';
    for(let i=0;i<8;i++){
      const a = (i/8)*Math.PI*2 + m.wobble*0.3;
      const sx = Math.cos(a)*m.r, sy = Math.sin(a)*m.r;
      const ex = Math.cos(a)*(m.r+9), ey = Math.sin(a)*(m.r+9);
      const perp = a+Math.PI/2;
      ctx.beginPath();
      ctx.moveTo(sx+Math.cos(perp)*4, sy+Math.sin(perp)*4);
      ctx.lineTo(ex, ey);
      ctx.lineTo(sx-Math.cos(perp)*4, sy-Math.sin(perp)*4);
      ctx.closePath();
      ctx.fill();
    }

    // ₿ symbol
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${m.r*1.1}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(120,60,0,0.5)';
    ctx.lineWidth = 2;
    ctx.strokeText('₿', 0, 2);
    ctx.fillText('₿', 0, 2);

    // angry eyes
    ctx.fillStyle = '#3a1c00';
    ctx.beginPath(); ctx.arc(-m.r*0.35, -m.r*0.15, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(m.r*0.35, -m.r*0.15, 2.5, 0, Math.PI*2); ctx.fill();

    ctx.restore();

    // hp bar if damaged
    if(m.maxHp > 1){
      const bw = m.r*1.6;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(m.x-bw/2, m.y-m.r-16, bw, 6);
      ctx.fillStyle = '#3ddc5c';
      ctx.fillRect(m.x-bw/2, m.y-m.r-16, bw*(m.hp/m.maxHp), 6);
    }
  }

  // ---------- UPDATE ----------
  let lastTime = 0;
  function update(dt){
    // keyboard aim (desktop arrows)
    if(keys['ArrowLeft']) player.aimAngle -= 0.04*dt;
    if(keys['ArrowRight']) player.aimAngle += 0.04*dt;
    if(keys['ArrowUp']) player.aimAngle -= 0; // no-op, kept for potential vertical
    // clamp aim to upper hemisphere-ish
    // (allow full circle for fun, no clamp)

    // reload
    if(reloading){
      reloadTimer -= dt;
      if(reloadTimer <= 0){
        reloading = false;
        ammo = maxAmmo;
      }
    }

    // spawn
    spawnTimer += dt;
    if(spawnTimer > spawnInterval){
      spawnTimer = 0;
      spawnMonster();
      if(Math.random() < 0.25 + wave*0.03) spawnMonster();
    }

    // wave progression
    waveTimer += dt;
    if(waveTimer > WAVE_DURATION){
      waveTimer = 0;
      wave++;
      spawnInterval = Math.max(500, spawnInterval - 120);
      updateHUD();
    }

    // bullets
    bullets.forEach(b=>{
      b.x += b.vx*dt;
      b.y += b.vy*dt;
      b.life -= dt;
    });
    bullets = bullets.filter(b=> b.life>0 && b.x>-20 && b.x<W+20 && b.y>-20 && b.y<H+20);

    // monsters
    monsters.forEach(m=>{
      m.x += m.vx*dt;
      m.y += m.vy*dt;
      m.wobble += 0.005*dt;
      if(m.hitFlash>0) m.hitFlash -= dt;
    });

    // collision: bullets vs monsters
    for(let bi=bullets.length-1; bi>=0; bi--){
      const b = bullets[bi];
      for(let mi=monsters.length-1; mi>=0; mi--){
        const m = monsters[mi];
        if(!m.alive) continue;
        const d = Math.hypot(b.x-m.x, b.y-m.y);
        if(d < m.r){
          m.hp--;
          m.hitFlash = 120;
          bullets.splice(bi,1);
          if(m.hp<=0){
            m.alive = false;
            score += m.points;
            spawnExplosion(m.x,m.y,'#f7931a');
            spawnFloatingText(m.x,m.y,'+'+m.points, '#ffd93d');
            playCoin();
            monsters.splice(mi,1);
            updateHUD();
          } else {
            playHit();
          }
          break;
        }
      }
    }

    // monsters leaving screen without being killed -> lose life
    for(let mi=monsters.length-1; mi>=0; mi--){
      const m = monsters[mi];
      if(m.x < -100 || m.x > W+100){
        monsters.splice(mi,1);
        lives--;
        playLoseLife();
        spawnFloatingText(player.x, player.y-100, 'KAÇTI!', '#ff4d4d');
        updateHUD();
        if(lives<=0){
          gameOver();
        }
      }
    }

    // particles
    particles.forEach(p=>{
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.vy += 0.0004*dt;
      p.life -= dt;
    });
    particles = particles.filter(p=>p.life>0);

    floatingTexts.forEach(f=>{ f.y -= 0.03*dt; f.life -= dt; });
    floatingTexts = floatingTexts.filter(f=>f.life>0);

    if(fireHeld){
      fireHoldTimer += dt;
      if(fireHoldTimer > 220){
        fireHoldTimer = 0;
        shoot();
      }
    } else {
      fireHoldTimer = 0;
    }
  }

  // ---------- DRAW ----------
  function drawBackground(){
    // sky gradient already CSS. Draw stars/moon subtle + buildings
    ctx.save();
    // distant buildings
    buildings.forEach(b=>{
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, H-160-b.h, b.w, b.h);
      // windows
      ctx.fillStyle = 'rgba(255,220,140,0.5)';
      for(let wy=H-150-b.h+10; wy<H-170; wy+=22){
        for(let wx=b.x+8; wx<b.x+b.w-8; wx+=16){
          if(Math.random()<0.6) ctx.fillRect(wx,wy,6,10);
        }
      }
    });
    ctx.restore();

    // ground / street
    const groundGrad = ctx.createLinearGradient(0,H-170,0,H);
    groundGrad.addColorStop(0,'#3a3a42');
    groundGrad.addColorStop(1,'#1c1c22');
    ctx.fillStyle = groundGrad;
    ctx.fillRect(0,H-170,W,170);

    // sidewalk lines
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 2;
    for(let x=-((Date.now()/20)%60); x<W; x+=60){
      ctx.beginPath(); ctx.moveTo(x,H-40); ctx.lineTo(x+30,H); ctx.stroke();
    }

    // brick wall behind player (nod to original artwork)
    const wallW = 260;
    const wallX = W/2 - wallW/2;
    ctx.fillStyle = getCSS('--brick-dark');
    ctx.fillRect(wallX, H-320, wallW, 320);
    ctx.strokeStyle = getCSS('--mortar');
    ctx.lineWidth = 1;
    for(let ry=H-320, row=0; ry<H; ry+=22, row++){
      ctx.beginPath(); ctx.moveTo(wallX,ry); ctx.lineTo(wallX+wallW,ry); ctx.stroke();
      const offset = (row%2===0) ? 0 : 25;
      for(let rx=wallX+offset; rx<wallX+wallW; rx+=50){
        ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx,ry+22); ctx.stroke();
      }
    }
  }

  function drawAimLine(){
    const gx = player.x + Math.cos(player.aimAngle)*40;
    const gy = (player.y-60) + Math.sin(player.aimAngle)*40;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,217,61,0.35)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6,8]);
    ctx.beginPath();
    ctx.moveTo(gx,gy);
    ctx.lineTo(gx+Math.cos(player.aimAngle)*400, gy+Math.sin(player.aimAngle)*400);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  function drawAmmoHUD(){
    ctx.save();
    const bx = W/2 - (maxAmmo*16)/2;
    const by = H - 190;
    for(let i=0;i<maxAmmo;i++){
      ctx.fillStyle = i < ammo ? '#ffd93d' : 'rgba(255,255,255,0.15)';
      ctx.fillRect(bx+i*16, by, 10, 16);
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.strokeRect(bx+i*16, by, 10, 16);
    }
    if(reloading){
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('YENİDEN DOLDURULUYOR...', W/2, by-8);
    }
    ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    drawBackground();
    drawAimLine();

    bullets.forEach(b=>{
      ctx.save();
      ctx.fillStyle = '#fff8d0';
      ctx.shadowColor = '#ffe58a';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(b.x,b.y,4,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    });

    monsters.forEach(drawMonster);

    particles.forEach(p=>{
      ctx.save();
      ctx.globalAlpha = Math.max(p.life/p.maxLife,0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x,p.y,3,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    });

    floatingTexts.forEach(f=>{
      ctx.save();
      ctx.globalAlpha = Math.max(f.life/f.maxLife,0);
      ctx.fillStyle = f.color;
      ctx.font = 'bold 18px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    });

    drawPlayer();
    drawAmmoHUD();
  }

  function loop(now){
    if(!running) return;
    const dt = Math.min(now - lastTime, 50);
    lastTime = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // init sizing dependent things after resize
  const origResize = resize;
  window.addEventListener('resize', ()=>{ placePlayer(); makeBuildings(); });
  placePlayer();
  makeBuildings();

  // initial idle draw behind start screen
  function idleDraw(){
    drawBackground();
    drawPlayer();
    if(!running) requestAnimationFrame(idleDraw);
  }
  requestAnimationFrame(idleDraw);

})();
</script>
